<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SmartChef - Search</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#04060a;--card:#090d14;--border:#12192a;--accent:#4f9cf9;--gold:#f5c842;--text:#e8edf5;--muted:#4a5568;}
body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;min-height:100vh;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(4,6,10,0.96);backdrop-filter:blur(24px);z-index:100;}
.nav-logo{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:8px 16px;border-radius:8px;color:var(--muted);font-size:14px;text-decoration:none;transition:color 0.2s;position:relative;}
.nav-link::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;transition:width 0.3s;}
.nav-link:hover::after,.nav-link.active::after{width:60%;}
.nav-link:hover{color:var(--text);}.nav-link.active{color:var(--accent);}
.logout-btn{padding:8px 18px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-size:13px;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;}
.logout-btn:hover{border-color:rgba(240,80,80,0.5);color:#f05050;}
.page{max-width:1100px;margin:0 auto;padding:48px 24px;}
.pt{font-family:"Playfair Display",serif;font-size:44px;font-weight:700;margin-bottom:6px;}
.ps{color:var(--muted);font-size:15px;margin-bottom:36px;}
.mode-sw{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:24px;width:fit-content;}
.mode-btn{padding:10px 26px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:all 0.3s;border:none;background:none;font-family:"Inter",sans-serif;}
.mode-btn.active{color:#04060a;background:linear-gradient(135deg,var(--accent),var(--gold));}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;margin-bottom:24px;}
.irow{display:flex;gap:10px;}
.sinput{flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:11px;font-size:14px;font-family:"Inter",sans-serif;outline:none;transition:all 0.3s;}
.sinput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,156,249,0.08);}
.sbtn{padding:14px 26px;background:linear-gradient(135deg,var(--accent),var(--gold));color:#04060a;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:"Inter",sans-serif;transition:transform 0.2s,box-shadow 0.2s;}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,156,249,0.3);}
.hints{margin-top:10px;font-size:13px;color:var(--muted);}
.ht{color:rgba(79,156,249,0.8);cursor:pointer;}.ht:hover{color:var(--accent);}
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:44px 24px;text-align:center;cursor:pointer;transition:all 0.3s;margin-bottom:14px;}
.drop-zone:hover{border-color:rgba(79,156,249,0.5);}
.dz-icon{font-size:44px;margin-bottom:12px;display:block;transition:transform 0.3s;}
.drop-zone:hover .dz-icon{transform:translateY(-8px) scale(1.1);}
.dz-txt{font-size:16px;font-weight:500;margin-bottom:4px;}.dz-sub{font-size:13px;color:var(--muted);}
.prev-wrap{margin-top:14px;display:none;justify-content:center;}
.prev-img{max-height:170px;border-radius:10px;border:1px solid var(--border);}
.ubtn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--gold));color:#04060a;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:"Inter",sans-serif;transition:transform 0.2s;}
.ubtn:hover{transform:translateY(-2px);}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center;}
.filter-label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.filter-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:9px;font-size:13px;font-family:"Inter",sans-serif;outline:none;cursor:pointer;transition:border-color 0.2s;}
.filter-select:focus{border-color:var(--accent);}
.filter-select option{background:#090d14;}
.filter-btn{padding:9px 16px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-size:13px;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;}
.filter-btn:hover{border-color:rgba(79,156,249,0.4);color:var(--accent);}
.det-box{background:rgba(79,156,249,0.05);border:1px solid rgba(79,156,249,0.15);border-radius:12px;padding:14px 18px;margin-bottom:22px;display:none;}
.det-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.tags{display:flex;gap:8px;flex-wrap:wrap;}
.tag{background:rgba(79,156,249,0.1);border:1px solid rgba(79,156,249,0.2);color:var(--accent);padding:5px 13px;border-radius:100px;font-size:12px;animation:tagPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes tagPop{from{opacity:0;transform:scale(0.6);}to{opacity:1;transform:none;}}
.ld{display:none;text-align:center;padding:56px;}
.cook{font-size:52px;animation:wb 0.45s ease-in-out infinite alternate;margin-bottom:14px;}
@keyframes wb{from{transform:rotate(-15deg);}to{transform:rotate(15deg) scale(1.15);}}
.ld-t{color:var(--muted);}
.rcount{font-size:13px;color:var(--muted);margin-bottom:18px;}
.rcount em{color:var(--accent);font-style:normal;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform 0.3s,border-color 0.3s,box-shadow 0.3s;animation:ci 0.5s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes ci{from{opacity:0;transform:translateY(20px) scale(0.96);}to{opacity:1;transform:none;}}
.card:hover{transform:translateY(-6px);border-color:rgba(79,156,249,0.25);box-shadow:0 20px 40px rgba(0,0,0,0.5);}
.food-img{width:100%;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;transition:transform 0.4s;}
.card:hover .food-img{transform:scale(1.04);}
.food-img .emoji{font-size:62px;line-height:1;}
.food-img .clbl{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;}
.img-wrap{position:relative;overflow:hidden;}
.score-badge{position:absolute;top:10px;right:10px;background:rgba(4,6,10,0.9);border:1px solid rgba(79,156,249,0.3);color:var(--accent);padding:3px 11px;border-radius:100px;font-size:11px;}
.cbody{padding:16px;}
.cname{font-size:14px;font-weight:500;margin-bottom:10px;line-height:1.4;}
.ctags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ctag{background:rgba(255,255,255,0.03);border:1px solid var(--border);padding:3px 9px;border-radius:100px;font-size:11px;color:var(--muted);}
.stars-row{display:flex;gap:3px;margin-bottom:10px;align-items:center;}
.sr{font-size:17px;cursor:pointer;color:#1a2540;transition:all 0.15s;background:none;border:none;padding:0;line-height:1;}
.sr:hover,.sr.on{color:var(--gold);}
.sr-lbl{font-size:11px;color:var(--muted);margin-left:4px;}
.save-btn{width:100%;padding:9px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-size:12px;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;}
.save-btn:hover{border-color:rgba(79,156,249,0.4);color:var(--accent);}
.save-btn.saved{background:rgba(79,156,249,0.07);border-color:rgba(79,156,249,0.3);color:var(--accent);}
.empty{text-align:center;padding:72px;color:var(--muted);}
.empty span{font-size:52px;display:block;margin-bottom:14px;animation:ef 2s ease-in-out infinite;}
@keyframes ef{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);z-index:999;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.on{display:flex;}
.modal{background:#090d14;border:1px solid #1a2540;border-radius:22px;width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:mi 0.4s cubic-bezier(0.16,1,0.3,1);}
@keyframes mi{from{opacity:0;transform:translateY(40px) scale(0.95);}to{opacity:1;transform:none;}}
.modal-stripe{height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),transparent);flex-shrink:0;}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:24px 26px 0;}
.modal-name{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;line-height:1.2;flex:1;}
.close-btn{width:34px;height:34px;background:rgba(255,255,255,0.05);border:1px solid #1a2540;border-radius:8px;color:#4a5568;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.close-btn:hover{color:#f05050;border-color:rgba(240,80,80,0.4);}
.modal-body{overflow-y:auto;padding:18px 26px 26px;flex:1;}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-thumb{background:#1a2540;border-radius:4px;}
.m-food-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin-bottom:18px;font-size:80px;}
.m-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.m-tag{background:rgba(255,255,255,0.04);border:1px solid #1a2540;padding:4px 12px;border-radius:100px;font-size:11px;color:#4a5568;}
.sec-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;margin-top:18px;}
.ing-list{display:flex;flex-wrap:wrap;gap:7px;}
.ing-tag{background:rgba(79,156,249,0.07);border:1px solid rgba(79,156,249,0.15);color:var(--accent);padding:4px 12px;border-radius:100px;font-size:12px;}
.step-row{display:flex;gap:11px;margin-bottom:12px;align-items:flex-start;}
.step-num{width:24px;height:24px;background:rgba(79,156,249,0.1);border:1px solid rgba(79,156,249,0.2);border-radius:50%;color:var(--accent);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.step-txt{font-size:13px;color:#6b7280;line-height:1.7;}
.m-footer{display:flex;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid #12192a;}
.m-save{flex:1;padding:12px;background:linear-gradient(135deg,var(--accent),var(--gold));color:#04060a;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:"Inter",sans-serif;transition:transform 0.2s;}
.m-save:hover{transform:translateY(-2px);}
.m-save.saved{background:rgba(79,156,249,0.1);color:var(--accent);border:1px solid rgba(79,156,249,0.3);}
.m-link{padding:12px 16px;background:transparent;border:1px solid #1a2540;color:#4a5568;border-radius:9px;font-size:13px;text-decoration:none;transition:all 0.2s;}
.m-link:hover{border-color:rgba(79,156,249,0.3);color:var(--accent);}
#imgPanel{display:none;}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">SmartChef</div>
  <div class="nav-links">
    <a href="home.html" class="nav-link">Home</a>
    <a href="dashboard.html" class="nav-link active">Search</a>
    <a href="favorites.html" class="nav-link">Favorites</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>
  <button class="logout-btn" onclick="doLogout()">&#8592; Logout</button>
</nav>
<div class="page">
  <div class="pt">Find Recipes</div>
  <div class="ps">Type ingredients or upload a photo</div>
  <div class="mode-sw">
    <button class="mode-btn active" onclick="sw('text')">&#9999; Type Ingredients</button>
    <button class="mode-btn" onclick="sw('image')">&#128247; Upload Photo</button>
  </div>
  <div class="panel" id="txtPanel">
    <div class="irow">
      <input class="sinput" id="ingInput" placeholder="tomato, onion, garlic, brinjal..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="sbtn" onclick="doSearch()">Find Recipes</button>
    </div>
    <div class="hints">Try: <span class="ht" onclick="qs('chicken, tomato, onion')">chicken, tomato</span> &nbsp;&#183;&nbsp; <span class="ht" onclick="qs('rice, potato, garlic')">rice, potato</span> &nbsp;&#183;&nbsp; <span class="ht" onclick="qs('paneer, spinach')">paneer, spinach</span></div>
  </div>
  <div class="panel" id="imgPanel">
    <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()" ondragover="event.preventDefault();this.style.borderColor='rgba(79,156,249,0.5)'" ondragleave="this.style.borderColor=''" ondrop="handleDrop(event)">
      <span class="dz-icon">&#128248;</span><div class="dz-txt">Drop your ingredient photo here</div><div class="dz-sub">Click to browse &#183; JPG PNG WEBP</div>
      <div class="prev-wrap" id="pw"><img class="prev-img" id="pi"></div>
    </div>
    <input type="file" id="fi" accept="image/*" style="display:none" onchange="handleFile(this.files[0])">
    <button class="ubtn" onclick="doImgSearch()">&#128269; Detect Ingredients and Find Recipes</button>
  </div>
  <div class="filters" id="filterBar" style="display:none">
    <span class="filter-label">Filter:</span>
    <select class="filter-select" id="cuisineFilter" onchange="applyFilters()"><option value="">All Cuisines</option></select>
    <select class="filter-select" id="timeFilter" onchange="applyFilters()">
      <option value="">Any Time</option>
      <option value="30">Under 30 mins</option>
      <option value="60">Under 1 hour</option>
      <option value="90">Under 90 mins</option>
    </select>
    <button class="filter-btn" onclick="clearFilters()">&#10005; Clear</button>
  </div>
  <div class="det-box" id="detBox"><div class="det-title">Detected Ingredients</div><div class="tags" id="detTags"></div></div>
  <div class="ld" id="ldBox"><div class="cook">&#127859;</div><div class="ld-t">Finding recipes...</div></div>
  <div id="results"></div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-stripe"></div>
    <div class="modal-top">
      <div class="modal-name" id="mName"></div>
      <button class="close-btn" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div id="mImg"></div>
      <div class="m-tags" id="mTags"></div>
      <div class="sec-lbl">Ingredients</div>
      <div class="ing-list" id="mIngs"></div>
      <div class="sec-lbl">Instructions</div>
      <div id="mSteps"></div>
      <div class="m-footer" id="mFooter"></div>
    </div>
  </div>
</div>
<script>
var token = localStorage.getItem('token');
if (!token) { window.location.replace('login.html'); }

var allRecipes = [];
var filteredRecipes = [];

function doLogout() {
  document.body.style.transition = 'opacity 0.5s';
  document.body.style.opacity = '0';
  setTimeout(function() { localStorage.removeItem('token'); window.location.replace('login.html'); }, 500);
}

function sw(m) {
  document.getElementById('txtPanel').style.display = m === 'text' ? 'block' : 'none';
  document.getElementById('imgPanel').style.display = m === 'image' ? 'block' : 'none';
  var btns = document.querySelectorAll('.mode-btn');
  btns[0].classList.toggle('active', m === 'text');
  btns[1].classList.toggle('active', m === 'image');
}

function qs(v) { document.getElementById('ingInput').value = v; doSearch(); }

function handleFile(f) {
  if (!f) return;
  document.getElementById('pi').src = URL.createObjectURL(f);
  document.getElementById('pw').style.display = 'flex';
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dz').style.borderColor = '';
  var f = e.dataTransfer.files[0];
  if (f) { document.getElementById('fi').files = e.dataTransfer.files; handleFile(f); }
}

function getEmoji(cuisine, name) {
  var c = (cuisine || '').toLowerCase();
  var n = (name || '').toLowerCase();
  if (n.includes('chicken') || n.includes('murgh')) return '🍗';
  if (n.includes('fish') || n.includes('prawn') || n.includes('shrimp')) return '🐟';
  if (n.includes('biryani') || n.includes('pulao')) return '🍚';
  if (n.includes('rice')) return '🍚';
  if (n.includes('dal') || n.includes('lentil') || n.includes('sambar')) return '🫘';
  if (n.includes('roti') || n.includes('naan') || n.includes('paratha') || n.includes('bread')) return '🫓';
  if (n.includes('paneer')) return '🧀';
  if (n.includes('soup') || n.includes('rasam')) return '🍜';
  if (n.includes('egg') || n.includes('omelette')) return '🥚';
  if (n.includes('cake') || n.includes('sweet') || n.includes('halwa') || n.includes('ladoo')) return '🍮';
  if (n.includes('salad')) return '🥗';
  if (n.includes('mutton') || n.includes('lamb')) return '🍖';
  if (c.includes('chinese')) return '🥢';
  if (c.includes('south indian')) return '🍛';
  return '🍽️';
}

function getGrad(cuisine) {
  var c = (cuisine || '').toLowerCase();
  if (c.includes('south indian')) return 'linear-gradient(135deg,#1a0800,#2d1200)';
  if (c.includes('north indian') || c.includes('punjabi')) return 'linear-gradient(135deg,#0a0818,#160a2d)';
  if (c.includes('chinese')) return 'linear-gradient(135deg,#051205,#0a1f0a)';
  if (c.includes('continental')) return 'linear-gradient(135deg,#050e18,#0a1a2d)';
  if (c.includes('kashmiri')) return 'linear-gradient(135deg,#0d0518,#1a0828)';
  if (c.includes('bengali')) return 'linear-gradient(135deg,#160e00,#261800)';
  if (c.includes('gujarati')) return 'linear-gradient(135deg,#160a00,#261500)';
  return 'linear-gradient(135deg,#0d1117,#1a2035)';
}

function renderGrid(recs) {
  if (!recs.length) {
    document.getElementById('results').innerHTML = '<div class="empty"><span>😔</span><div>No recipes found. Try different ingredients!</div></div>';
    return;
  }
  var html = '<div class="rcount">Showing <em>' + recs.length + '</em> recipes &nbsp;&#183;&nbsp; Click any card for full instructions</div><div class="grid">';
  for (var i = 0; i < recs.length; i++) {
    var r = recs[i];
    var emoji = getEmoji(r.cuisine, r.name);
    var grad = getGrad(r.cuisine);
    var savedR = parseInt(localStorage.getItem('rating-' + r.id)) || 0;
    var stars = '';
    for (var n = 1; n <= 5; n++) {
      stars += '<button class="sr' + (savedR >= n ? ' on' : '') + '" onclick="event.stopPropagation();rateR(' + r.id + ',' + n + ',this)">&#9733;</button>';
    }
    html += '<div class="card" style="animation-delay:' + (i * 0.04) + 's" onclick="openModal(' + r.id + ')">'
      + '<div class="img-wrap"><div class="food-img" style="background:' + grad + '">'
      + '<span class="emoji">' + emoji + '</span>'
      + '<span class="clbl">' + r.cuisine + '</span>'
      + '</div><div class="score-badge">' + r.match_score + ' match</div></div>'
      + '<div class="cbody">'
      + '<div class="cname">' + r.name + '</div>'
      + '<div class="ctags"><span class="ctag">' + r.cuisine + '</span><span class="ctag">&#9201; ' + r.time + '</span></div>'
      + '<div class="stars-row">' + stars + '<span class="sr-lbl" id="rl' + r.id + '">' + (savedR ? '(' + savedR + '/5)' : 'Rate this') + '</span></div>'
      + '<button class="save-btn" id="sb' + r.id + '" onclick="event.stopPropagation();doSave(' + r.id + ',this)">&#9825; Save Recipe</button>'
      + '</div></div>';
  }
  html += '</div>';
  document.getElementById('results').innerHTML = html;
}

function renderResults(data) {
  var det = data.detected_ingredients || [];
  var recs = data.recommended_recipes || [];
  allRecipes = recs;
  filteredRecipes = recs;
  if (det.length) {
    document.getElementById('detBox').style.display = 'block';
    var th = '';
    for (var i = 0; i < det.length; i++) {
      th += '<span class="tag" style="animation-delay:' + (i * 0.06) + 's">' + det[i] + '</span>';
    }
    document.getElementById('detTags').innerHTML = th;
  }
  if (recs.length) {
    var sel = document.getElementById('cuisineFilter');
    var cuisines = [];
    for (var i = 0; i < recs.length; i++) {
      if (recs[i].cuisine && cuisines.indexOf(recs[i].cuisine) === -1) cuisines.push(recs[i].cuisine);
    }
    cuisines.sort();
    sel.innerHTML = '<option value="">All Cuisines</option>';
    for (var i = 0; i < cuisines.length; i++) {
      sel.innerHTML += '<option value="' + cuisines[i] + '">' + cuisines[i] + '</option>';
    }
    document.getElementById('filterBar').style.display = 'flex';
  }
  renderGrid(recs);
}

function applyFilters() {
  var cuisine = document.getElementById('cuisineFilter').value;
  var time = parseInt(document.getElementById('timeFilter').value) || 0;
  var filtered = [];
  for (var i = 0; i < allRecipes.length; i++) {
    var r = allRecipes[i];
    if (cuisine && r.cuisine !== cuisine) continue;
    if (time && parseInt(r.time) > time) continue;
    filtered.push(r);
  }
  renderGrid(filtered);
}

function clearFilters() {
  document.getElementById('cuisineFilter').value = '';
  document.getElementById('timeFilter').value = '';
  renderGrid(allRecipes);
}

function setLoading(on) {
  document.getElementById('ldBox').style.display = on ? 'block' : 'none';
  document.getElementById('results').innerHTML = '';
  document.getElementById('detBox').style.display = 'none';
  document.getElementById('filterBar').style.display = 'none';
}

async function doSearch() {
  var val = document.getElementById('ingInput').value.trim();
  if (!val) return;
  var ings = val.split(',');
  var clean = [];
  for (var i = 0; i < ings.length; i++) { var s = ings[i].trim(); if (s) clean.push(s); }
  setLoading(true);
  try {
    var res = await fetch('http://127.0.0.1:8000/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ingredients: clean })
    });
    var data = await res.json();
    renderResults(data);
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="empty"><span>😟</span><div>Backend not reachable. Run: uvicorn main:app --reload</div></div>';
  }
  document.getElementById('ldBox').style.display = 'none';
}

async function doImgSearch() {
  var file = document.getElementById('fi').files[0];
  if (!file) { alert('Please select an image first!'); return; }
  var fd = new FormData();
  fd.append('file', file);
  setLoading(true);
  try {
    var res = await fetch('http://127.0.0.1:8000/upload', { method: 'POST', body: fd });
    var data = await res.json();
    renderResults(data);
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="empty"><span>😟</span><div>Backend not reachable.</div></div>';
  }
  document.getElementById('ldBox').style.display = 'none';
}

async function doSave(id, btn) {
  try {
    var res = await fetch('http://127.0.0.1:8000/save/' + id, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    var d = await res.json();
    btn.innerHTML = '&#10084; ' + d.message;
    btn.classList.add('saved');
    var ms = document.getElementById('ms' + id);
    if (ms) { ms.innerHTML = '&#10084; Saved'; ms.classList.add('saved'); }
  } catch(e) { alert('Could not save.'); }
}

function rateR(id, n, btn) {
  localStorage.setItem('rating-' + id, n);
  var row = btn.parentNode;
  var btns = row.querySelectorAll('.sr');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.toggle('on', i < n); }
  var lbl = document.getElementById('rl' + id);
  if (lbl) lbl.textContent = '(' + n + '/5)';
  btn.style.transform = 'scale(1.4)';
  setTimeout(function() { btn.style.transform = ''; }, 200);
}

function openModal(id) {
  var r = null;
  for (var i = 0; i < allRecipes.length; i++) { if (allRecipes[i].id === id) { r = allRecipes[i]; break; } }
  if (!r) return;

  document.getElementById('mName').textContent = r.name;

  var emoji = getEmoji(r.cuisine, r.name);
  var grad = getGrad(r.cuisine);
  document.getElementById('mImg').innerHTML = '<div class="m-food-img" style="background:' + grad + '">' + emoji + '</div>';

  document.getElementById('mTags').innerHTML =
    '<span class="m-tag">' + r.cuisine + '</span>' +
    '<span class="m-tag">&#9201; ' + r.time + '</span>' +
    '<span class="m-tag">&#9733; ' + r.match_score + ' match</span>';

  var ings = (r.ingredients || '').split(',');
  var ingHtml = '';
  for (var i = 0; i < ings.length; i++) {
    var ing = ings[i].trim();
    if (ing) ingHtml += '<span class="ing-tag">' + ing + '</span>';
  }
  document.getElementById('mIngs').innerHTML = ingHtml || '<span style="color:var(--muted)">Not available</span>';

  var raw = (r.instructions || 'No instructions available.').trim();
  var parts = raw.split('. ');
  var stepsHtml = '';
  if (parts.length > 1) {
    var count = 0;
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s.length > 5) {
        count++;
        stepsHtml += '<div class="step-row"><div class="step-num">' + count + '</div><div class="step-txt">' + s + (s.slice(-1) !== '.' ? '.' : '') + '</div></div>';
      }
    }
  } else {
    stepsHtml = '<div class="step-txt" style="color:#6b7280;line-height:1.8">' + raw + '</div>';
  }
  document.getElementById('mSteps').innerHTML = stepsHtml;

  var isSaved = document.getElementById('sb' + id) && document.getElementById('sb' + id).classList.contains('saved');
  var footer = '<button class="m-save' + (isSaved ? ' saved' : '') + '" id="ms' + id + '" onclick="doSave(' + id + ',this)">' + (isSaved ? '&#10084; Saved' : '&#9825; Save Recipe') + '</button>';
  if (r.url) footer += '<a href="' + r.url + '" target="_blank" class="m-link">Full Recipe &#8599;</a>';
  document.getElementById('mFooter').innerHTML = footer;

  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('on');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
