<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SmartChef - Favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#04060a;--card:#090d14;--border:#12192a;--accent:#4f9cf9;--gold:#f5c842;--text:#e8edf5;--muted:#4a5568;}
body{background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;min-height:100vh;}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
nav{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(4,6,10,0.96);backdrop-filter:blur(24px);z-index:100;}
.nav-logo{font-family:"Playfair Display",serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:8px 16px;border-radius:8px;color:var(--muted);font-size:14px;text-decoration:none;transition:color 0.2s;position:relative;}
.nav-link::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:2px;transition:width 0.3s;}
.nav-link:hover::after,.nav-link.active::after{width:60%;}
.nav-link:hover{color:var(--text);}.nav-link.active{color:var(--accent);}
.logout-btn{padding:8px 18px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;font-size:13px;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;}
.logout-btn:hover{border-color:rgba(240,80,80,0.5);color:#f05050;}
.page{max-width:1100px;margin:0 auto;padding:48px 24px;position:relative;z-index:1;}
.pt{font-family:"Playfair Display",serif;font-size:44px;font-weight:700;margin-bottom:6px;}
.ps{color:var(--muted);font-size:15px;margin-bottom:36px;}
.ld{text-align:center;padding:80px;}
.spin{font-size:56px;display:block;margin-bottom:16px;animation:sp 0.6s ease-in-out infinite alternate;}
@keyframes sp{from{transform:rotate(-12deg);}to{transform:rotate(12deg) scale(1.1);}}
.ld-t{color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform 0.3s,border-color 0.3s,box-shadow 0.3s;animation:ci 0.5s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes ci{from{opacity:0;transform:translateY(20px) scale(0.96);}to{opacity:1;transform:none;}}
.card:hover{transform:translateY(-6px);border-color:rgba(79,156,249,0.25);box-shadow:0 20px 40px rgba(0,0,0,0.5);}
.food-img{width:100%;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform 0.4s;}
.card:hover .food-img{transform:scale(1.04);}
.food-img .emoji{font-size:62px;line-height:1;}
.food-img .clbl{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase;}
.img-wrap{position:relative;overflow:hidden;}
.fav-badge{position:absolute;top:10px;right:10px;background:rgba(4,6,10,0.9);border:1px solid rgba(240,80,80,0.3);color:#f07070;padding:3px 11px;border-radius:100px;font-size:11px;}
.cbody{padding:16px;}
.cname{font-size:14px;font-weight:500;margin-bottom:10px;line-height:1.4;cursor:pointer;transition:color 0.2s;}
.cname:hover{color:var(--accent);}
.ctags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.ctag{background:rgba(255,255,255,0.03);border:1px solid var(--border);padding:3px 9px;border-radius:100px;font-size:11px;color:var(--muted);}
.view-btn{width:100%;padding:10px;background:transparent;border:1px solid rgba(79,156,249,0.25);color:var(--accent);border-radius:9px;font-size:12px;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;margin-bottom:8px;display:block;text-align:center;}
.view-btn:hover{background:rgba(79,156,249,0.08);}
.rm-btn{width:100%;padding:9px;background:transparent;border:1px solid rgba(240,80,80,0.2);color:#f07070;border-radius:9px;font-size:12px;cursor:pointer;font-family:"Inter",sans-serif;transition:all 0.2s;}
.rm-btn:hover{background:rgba(240,80,80,0.08);}
.empty{text-align:center;padding:100px 24px;}
.empty-ic{font-size:72px;display:block;margin-bottom:24px;animation:ef 2s ease-in-out infinite;}
@keyframes ef{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-14px) rotate(5deg);}}
.empty-t{font-family:"Playfair Display",serif;font-size:36px;margin-bottom:12px;}
.empty-s{color:var(--muted);margin-bottom:32px;}
.empty-btn{padding:14px 34px;background:linear-gradient(135deg,var(--accent),var(--gold));color:#04060a;border:none;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:"Inter",sans-serif;text-decoration:none;display:inline-block;}
.err{text-align:center;padding:60px;color:#f07070;font-size:15px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(16px);z-index:999;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.on{display:flex;}
.modal{background:#090d14;border:1px solid #1a2540;border-radius:22px;width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;animation:mi 0.4s cubic-bezier(0.16,1,0.3,1);}
@keyframes mi{from{opacity:0;transform:translateY(40px) scale(0.95);}to{opacity:1;transform:none;}}
.modal-stripe{height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),transparent);flex-shrink:0;}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:24px 26px 0;}
.modal-name{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;line-height:1.2;flex:1;}
.close-btn{width:34px;height:34px;background:rgba(255,255,255,0.05);border:1px solid #1a2540;border-radius:8px;color:#4a5568;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.close-btn:hover{color:#f05050;border-color:rgba(240,80,80,0.4);}
.modal-body{overflow-y:auto;padding:18px 26px 26px;flex:1;}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-thumb{background:#1a2540;border-radius:4px;}
.m-food-img{width:100%;height:180px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin-bottom:18px;font-size:80px;}
.m-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.m-tag{background:rgba(255,255,255,0.04);border:1px solid #1a2540;padding:4px 12px;border-radius:100px;font-size:11px;color:#4a5568;}
.sec-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;margin-top:18px;}
.ing-list{display:flex;flex-wrap:wrap;gap:7px;}
.ing-tag{background:rgba(79,156,249,0.07);border:1px solid rgba(79,156,249,0.15);color:var(--accent);padding:4px 12px;border-radius:100px;font-size:12px;}
.step-row{display:flex;gap:11px;margin-bottom:12px;align-items:flex-start;}
.step-num{width:24px;height:24px;background:rgba(79,156,249,0.1);border:1px solid rgba(79,156,249,0.2);border-radius:50%;color:var(--accent);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.step-txt{font-size:13px;color:#6b7280;line-height:1.7;}
.m-footer{display:flex;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid #12192a;}
.m-link{padding:12px 16px;background:transparent;border:1px solid #1a2540;color:#4a5568;border-radius:9px;font-size:13px;text-decoration:none;transition:all 0.2s;}
.m-link:hover{border-color:rgba(79,156,249,0.3);color:var(--accent);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav>
  <div class="nav-logo">SmartChef</div>
  <div class="nav-links">
    <a href="home.html" class="nav-link">Home</a>
    <a href="dashboard.html" class="nav-link">Search</a>
    <a href="favorites.html" class="nav-link active">Favorites</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>
  <button class="logout-btn" onclick="doLogout()">&#8592; Logout</button>
</nav>
<div class="page">
  <div class="pt">My Favorites</div>
  <div class="ps">Recipes you have saved</div>
  <div id="ld" class="ld"><span class="spin">&#127869;</span><div class="ld-t">Loading your favorites...</div></div>
  <div id="content"></div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-stripe"></div>
    <div class="modal-top">
      <div class="modal-name" id="mName"></div>
      <button class="close-btn" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div id="mImg"></div>
      <div class="m-tags" id="mTags"></div>
      <div class="sec-lbl">Ingredients</div>
      <div class="ing-list" id="mIngs"></div>
      <div class="sec-lbl">Instructions</div>
      <div id="mSteps"></div>
      <div class="m-footer" id="mFooter"></div>
    </div>
  </div>
</div>
<script>
var token = localStorage.getItem('token');
if (!token) { window.location.replace('login.html'); }

var recipes = [];

// particles
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);
var pts = [];
for (var i = 0; i < 60; i++) {
  pts.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.2 + 0.2, s: Math.random() * 0.15 + 0.03, op: Math.random() * 0.25 + 0.04, dr: (Math.random() - 0.5) * 0.07, tw: Math.random() * Math.PI * 2, tws: Math.random() * 0.015 });
}
function drawPts() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < pts.length; i++) {
    var p = pts[i];
    p.tw += p.tws;
    var o = p.op * (0.5 + 0.5 * Math.sin(p.tw));
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(79,156,249,' + o + ')'; ctx.fill();
    p.y -= p.s; p.x += p.dr;
    if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }
  }
  requestAnimationFrame(drawPts);
}
drawPts();

function doLogout() {
  document.body.style.transition = 'opacity 0.5s';
  document.body.style.opacity = '0';
  setTimeout(function() { localStorage.removeItem('token'); window.location.replace('login.html'); }, 500);
}

function getEmoji(cuisine, name) {
  var c = (cuisine || '').toLowerCase();
  var n = (name || '').toLowerCase();
  if (n.includes('chicken') || n.includes('murgh')) return '🍗';
  if (n.includes('fish') || n.includes('prawn') || n.includes('shrimp')) return '🐟';
  if (n.includes('biryani') || n.includes('pulao')) return '🍚';
  if (n.includes('rice')) return '🍚';
  if (n.includes('dal') || n.includes('lentil') || n.includes('sambar')) return '🫘';
  if (n.includes('roti') || n.includes('naan') || n.includes('paratha') || n.includes('bread')) return '🫓';
  if (n.includes('paneer')) return '🧀';
  if (n.includes('soup') || n.includes('rasam')) return '🍜';
  if (n.includes('egg') || n.includes('omelette')) return '🥚';
  if (n.includes('sweet') || n.includes('halwa') || n.includes('ladoo')) return '🍮';
  if (n.includes('mutton') || n.includes('lamb')) return '🍖';
  if (c.includes('chinese')) return '🥢';
  return '🍽️';
}

function getGrad(cuisine) {
  var c = (cuisine || '').toLowerCase();
  if (c.includes('south indian')) return 'linear-gradient(135deg,#1a0800,#2d1200)';
  if (c.includes('north indian') || c.includes('punjabi')) return 'linear-gradient(135deg,#0a0818,#160a2d)';
  if (c.includes('chinese')) return 'linear-gradient(135deg,#051205,#0a1f0a)';
  if (c.includes('continental')) return 'linear-gradient(135deg,#050e18,#0a1a2d)';
  if (c.includes('kashmiri')) return 'linear-gradient(135deg,#0d0518,#1a0828)';
  return 'linear-gradient(135deg,#0d1117,#1a2035)';
}

function openModal(id) {
  var r = null;
  for (var i = 0; i < recipes.length; i++) {
    if (recipes[i].id === id) { r = recipes[i]; break; }
  }
  if (!r) return;

  document.getElementById('mName').textContent = r.name;

  var emoji = getEmoji(r.cuisine, r.name);
  var grad = getGrad(r.cuisine);
  document.getElementById('mImg').innerHTML = '<div class="m-food-img" style="background:' + grad + '">' + emoji + '</div>';

  document.getElementById('mTags').innerHTML =
    '<span class="m-tag">' + r.cuisine + '</span>' +
    '<span class="m-tag">&#9201; ' + r.time + '</span>';

  var ings = (r.ingredients || '').split(',');
  var ingHtml = '';
  for (var i = 0; i < ings.length; i++) {
    var ing = ings[i].trim();
    if (ing) ingHtml += '<span class="ing-tag">' + ing + '</span>';
  }
  document.getElementById('mIngs').innerHTML = ingHtml || '<span style="color:var(--muted)">Not available</span>';

  var raw = (r.instructions || 'No instructions available.').trim();
  var parts = raw.split('. ');
  var stepsHtml = '';
  if (parts.length > 1) {
    var count = 0;
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s.length > 5) {
        count++;
        stepsHtml += '<div class="step-row"><div class="step-num">' + count + '</div><div class="step-txt">' + s + (s.slice(-1) !== '.' ? '.' : '') + '</div></div>';
      }
    }
  } else {
    stepsHtml = '<div class="step-txt" style="color:#6b7280;line-height:1.8">' + raw + '</div>';
  }
  document.getElementById('mSteps').innerHTML = stepsHtml;

  var footer = r.url ? '<a href="' + r.url + '" target="_blank" class="m-link">Full Recipe &#8599;</a>' : '';
  document.getElementById('mFooter').innerHTML = footer;

  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('on');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

async function removeFav(id, name) {
  if (!confirm('Remove "' + name + '" from favorites?')) return;
  var card = document.getElementById('card-' + id);
  if (card) {
    card.style.transition = 'all 0.4s';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.9)';
  }
  recipes = recipes.filter(function(r) { return r.id !== id; });
  setTimeout(function() {
    if (card) card.remove();
    if (recipes.length === 0) showEmpty();
  }, 400);
  try {
    await fetch('http://127.0.0.1:8000/remove/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
  } catch(e) {}
}

function showEmpty() {
  document.getElementById('content').innerHTML =
    '<div class="empty"><span class="empty-ic">&#9825;</span><div class="empty-t">No favourites yet</div>' +
    '<div class="empty-s">Go find some recipes you love</div>' +
    '<a href="dashboard.html" class="empty-btn">Find Recipes</a></div>';
}

async function loadFavs() {
  try {
    var res = await fetch('http://127.0.0.1:8000/favorites', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    document.getElementById('ld').style.display = 'none';
    if (res.status === 401) { localStorage.removeItem('token'); window.location.replace('login.html'); return; }
    var data = await res.json();
    recipes = data;
    if (!Array.isArray(data) || data.length === 0) { showEmpty(); return; }

    var html = '<div class="grid">';
    for (var i = 0; i < data.length; i++) {
      var r = data[i];
      var emoji = getEmoji(r.cuisine, r.name);
      var grad = getGrad(r.cuisine);
      var safeName = r.name.replace(/'/g, '').replace(/"/g, '');
      html += '<div class="card" id="card-' + r.id + '" style="animation-delay:' + (i * 0.06) + 's">'
        + '<div class="img-wrap">'
        + '<div class="food-img" style="background:' + grad + '" onclick="openModal(' + r.id + ')">'
        + '<span class="emoji">' + emoji + '</span>'
        + '<span class="clbl">' + r.cuisine + '</span>'
        + '</div>'
        + '<div class="fav-badge">&#10084; Saved</div>'
        + '</div>'
        + '<div class="cbody">'
        + '<div class="cname" onclick="openModal(' + r.id + ')">' + r.name + '</div>'
        + '<div class="ctags"><span class="ctag">' + r.cuisine + '</span><span class="ctag">&#9201; ' + r.time + '</span></div>'
        + '<button class="view-btn" onclick="openModal(' + r.id + ')">&#128065; View Recipe and Instructions</button>'
        + '<button class="rm-btn" onclick="removeFav(' + r.id + ', \'' + safeName + '\')">&#128465; Remove from Favorites</button>'
        + '</div></div>';
    }
    html += '</div>';
    document.getElementById('content').innerHTML = html;

  } catch(err) {
    document.getElementById('ld').style.display = 'none';
    document.getElementById('content').innerHTML = '<div class="err">&#128577; Backend not reachable<br><small style="color:var(--muted)">Run: uvicorn main:app --reload</small></div>';
  }
}

loadFavs();
</script>
</body>
</html>
